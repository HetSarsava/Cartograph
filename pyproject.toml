[project]
name = "cartograph"
version = "0.1.0"
description = "Python patch evidence: dependency paths, per-test execution and bounded mutation checks, with MCP tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cartograph" }]
dependencies = [
    "mcp>=2.0.0,<3",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "libcst>=1.4.0",
    "groq>=0.11.0",
    "pytest-json-report>=1.5.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "coverage>=7.6,<8",
    "pytest>=8.3,<10",
]

[project.scripts]
cartograph = "cartograph.cli:main"
cartograph-mcp = "cartograph.mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# We have no class-based tests; the default "Test*" pattern otherwise tries
# (and warns when it fails) to collect result/model classes like TestOutcome,
# TestCaseResult, and TestRunResult in tools/test_runner.py.
python_classes = ["TestSuite*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["cartograph"]
ignore_missing_imports = true
